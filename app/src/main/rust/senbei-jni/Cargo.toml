[package]
name = "senbei-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "JNI bridge exposing Senbei's static library restoration to HachiDroid"
# Senbei is AGPL-3.0-only; this crate is a derivative work of it. See README.md.
license = "AGPL-3.0-only"

[lib]
name = "senbei_jni"
crate-type = ["cdylib"]

[dependencies]
senbei-engine = { git = "https://github.com/Tenshou170/Senbei", rev = "899badab75fd35a1d88602650bcf3c6ef4ba3460" }
senbei-io = { git = "https://github.com/Tenshou170/Senbei", rev = "899badab75fd35a1d88602650bcf3c6ef4ba3460" }
jni = "0.21"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
