name: Create Android Release

permissions:
  contents: write
  id-token: write
  attestations: write

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    # No event guard: workflow_dispatch has no head_commit to check, and manual
    # dispatches can't carry a push's [ci skip] marker anyway.
    # Node 24 (Actions default since 2026-06-16) runs every action used here —
    # all declare runs.using: node24, so no FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: "temurin"
        java-version: 21

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Ensure Android 17 (API 37) SDK platform
      run: |
        SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SDKM" ] || SDKM=sdkmanager
        yes | "$SDKM" "platforms;android-37.0" || true
        yes | "$SDKM" "build-tools;37.0.0" || true

    # The restore bridge (app/src/main/rust/senbei-jni) needs an NDK to link
    # arm64-v8a. Prefer whatever the image ships, otherwise fetch one; either
    # way expose it as ANDROID_NDK_ROOT so the buildSenbeiJni task finds it.
    - name: Locate Android NDK
      run: |
        set -euo pipefail
        NDK_DIR="$(ls -d "${ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)"
        if [ -z "$NDK_DIR" ]; then
          SDKM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=sdkmanager
          yes | "$SDKM" "ndk;27.3.13750724"
          NDK_DIR="${ANDROID_HOME}/ndk/27.3.13750724"
        fi
        [ -d "$NDK_DIR/toolchains/llvm/prebuilt" ] || { echo "No usable NDK at $NDK_DIR"; exit 1; }
        echo "Using NDK: $NDK_DIR"
        echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

    # Official rustup installer only — no third-party action holds the toolchain.
    - name: Set up Rust (aarch64-linux-android)
      run: |
        set -euo pipefail
        if command -v rustup >/dev/null 2>&1; then
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
        else
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --target aarch64-linux-android
        fi
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        "${CARGO_HOME:-$HOME/.cargo}/bin/rustc" --version
        "${CARGO_HOME:-$HOME/.cargo}/bin/cargo" --version

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          app/build/rust/senbei-jni
        key: ${{ runner.os }}-cargo-${{ hashFiles('app/src/main/rust/senbei-jni/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Test native bridge
      # Host-side unit tests only: the real-library cases stay skipped unless
      # SENBEI_TEST_LIB points at a fixture, which CI deliberately does not have.
      run: cargo test --release --manifest-path app/src/main/rust/senbei-jni/Cargo.toml

    - name: Decode release signing key
      run: |
        echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > release.keystore
        echo "RELEASE_KEYSTORE_PATH=$(realpath release.keystore)" >> $GITHUB_ENV

    - name: Build with Gradle
      run: ./gradlew build
      env:
        SIGNING_KEY_FILE: ${{ env.RELEASE_KEYSTORE_PATH }}
        SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Verify native bridge is packaged
      # The bridge is optional for local builds, but a release that silently
      # ships without it would drop on-device restore for everyone.
      run: |
        set -euo pipefail
        SO=app/build/generated/senbeiJniLibs/arm64-v8a/libsenbei_jni.so
        [ -f "$SO" ] || { echo "::error::libsenbei_jni.so was not built"; exit 1; }
        for apk in app/build/outputs/apk/release/*.apk; do
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libsenbei_jni.so' \
            || { echo "::error::$(basename "$apk") is missing libsenbei_jni.so"; exit 1; }
          echo "$(basename "$apk"): native bridge present"
        done

    - name: Generate release checksums
      # Consumed by HachiDroid's built-in updater to verify downloaded APKs
      # (fallback when the GitHub asset digest is unavailable).
      run: |
        cd app/build/outputs/apk/release
        sha256sum *.apk > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Attest App
      uses: actions/attest@v4
      with:
        subject-path: app/build/outputs/apk/release/*.apk

    - name: Set app version env var
      run: |
        VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    - name: Create release notes
      run: |
        if ! git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            git tag $LATEST_TAG
          fi

          # Tolerate the first release (or a tag with no tagged ancestor):
          # without `|| true` this assignment fails the step under `set -e`.
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${LATEST_TAG}^" 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "## What's Changed" > CHANGELOG.md
          COMMIT_HASHES=$(git rev-list --no-merges ${PREVIOUS_TAG}..${LATEST_TAG})

          IFS=$'\n'

          for hash in $COMMIT_HASHES; do
            subject=$(git show -s --format=%s $hash)
            body=$(git show -s --format=%b $hash)
            author_login=$(gh api "repos/${{ github.repository }}/commits/$hash" --jq '.author.login' 2>/dev/null || echo "")
            if [ -n "$author_login" ]; then
              author="$author_login"
            else
              author=$(git show -s --format=%an $hash)
            fi
            short_hash=$(git show -s --format=%h $hash)

            echo "* **$subject**" >> CHANGELOG.md

            if [ -n "$body" ]; then
              echo "$body" | while read -r line; do
                if [ -z "$line" ]; then continue; fi
                clean_line=$(echo "$line" | sed -E 's/^[ \t]*[-*+][ \t]*//')
                echo "    * $clean_line" >> CHANGELOG.md
              done
            fi
            echo "    (by @$author in $short_hash)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          done

          unset IFS
      env:
        GH_TOKEN: ${{ github.token }}
        LATEST_TAG: "v${{ env.VERSION_NAME }}"

    - name: Upload binaries to a release
      uses: softprops/action-gh-release@v3
      with:
        body_path: CHANGELOG.md
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/release/SHA256SUMS.txt
        tag_name: "v${{ env.VERSION_NAME }}"
